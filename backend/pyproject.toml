[project]
name = "causallens-backend"
version = "0.1.0"
description = "CausalLens statistical engine — hypothesis testing, Bayesian A/B, and causal inference"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pandas>=2.2",
    "python-multipart>=0.0.12",
    "greenlet>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2>=2.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
